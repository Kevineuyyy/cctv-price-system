<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin CCTV</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-5">

<div class="max-w-5xl mx-auto">

  <h1 class="text-3xl font-bold mb-5">
    ADMIN CCTV SYSTEM
  </h1>

  <div class="bg-white p-5 rounded-xl shadow mb-5">

    <h2 class="text-xl font-bold mb-4">
      Tambah Produk
    </h2>

    <div class="grid grid-cols-2 gap-3">

      <input
        id="seri"
        placeholder="Seri"
        class="border p-3 rounded-lg"
      >

      <input
        id="jenis"
        placeholder="Jenis"
        class="border p-3 rounded-lg"
      >

      <input
        id="resolusi"
        placeholder="Resolusi"
        class="border p-3 rounded-lg"
      >

      <input
        id="harga"
        type="number"
        placeholder="Harga"
        class="border p-3 rounded-lg"
      >

    </div>

    <button
      id="addBtn"
      class="mt-4 bg-blue-600 text-white px-5 py-3 rounded-lg"
    >
      Tambah Produk
    </button>

  </div>

  <div class="bg-white p-5 rounded-xl shadow">

    <table
  id="cctvSection"
  class="w-full"
>
      <thead class="bg-gray-200">

        <tr>

          <th class="p-3">Seri</th>
          <th class="p-3">Jenis</th>
          <th class="p-3">Resolusi</th>
          <th class="p-3">Harga</th>
          <th class="p-3">Aksi</th>s

        </tr>

      </thead>

      <tbody id="tableData">

      </tbody>

    </table>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyCZ-2wwPQ9AQ9CkF6XEqHNHRLWAATzP2js",
  authDomain: "cctv-price-system.firebaseapp.com",
  projectId: "cctv-price-system",
  storageBucket: "cctv-price-system.firebasestorage.app",
  messagingSenderId: "628180371498",
  appId: "1:628180371498:web:b33ce80a756a0e2bf0db53"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const table =
  document.getElementById("tableData");

async function loadData() {

  const querySnapshot =
    await getDocs(collection(db, "cctv"));

  table.innerHTML = "";

  querySnapshot.forEach((doc) => {

    const item = doc.data();

    table.innerHTML += `

<tr class="border-b">

  <td class="p-3">
    ${item.seri}
  </td>

  <td class="p-3">
    ${item.jenis}
  </td>

  <td class="p-3">
    ${item.resolusi}
  </td>

  <td class="p-3">
    Rp ${Number(item.harga)
      .toLocaleString("id-ID")}
  </td>

  <td class="p-3 flex gap-2">

  <button
    onclick="editProduk(
      '${doc.id}',
      '${item.seri}',
      '${item.jenis}',
      '${item.resolusi}',
      '${item.harga}'
    )"
    class="bg-yellow-500 text-white px-3 py-1 rounded"
  >
    Edit
  </button>

  <button
    onclick="hapus('${doc.id}')"
    class="bg-red-500 text-white px-3 py-1 rounded"
  >
    Hapus
  </button>

</td>

  </td>

</tr>

`;

  });

}

loadData();

document.getElementById("addBtn")
.addEventListener("click", async () => {

  await addDoc(collection(db, "cctv"), {

    seri:
      document.getElementById("seri").value,

    jenis:
      document.getElementById("jenis").value,

    resolusi:
      document.getElementById("resolusi").value,

    harga:
      Number(document.getElementById("harga").value)

  });

  alert("Produk berhasil ditambahkan");

  loadData();

});
window.hapus = async function(id) {

  if(confirm("Hapus produk?")) {

    await deleteDoc(doc(db, "cctv", id));

    loadData();

  }

}
window.editProduk = async function(
  id,
  seriLama,
  jenisLama,
  resolusiLama,
  hargaLama
) {

  const seriBaru =
    prompt("Edit Seri", seriLama);

  const jenisBaru =
    prompt("Edit Jenis", jenisLama);

  const resolusiBaru =
    prompt("Edit Resolusi", resolusiLama);

  const hargaBaru =
    prompt("Edit Harga", hargaLama);

  if(
    seriBaru &&
    jenisBaru &&
    resolusiBaru &&
    hargaBaru
  ) {

    await updateDoc(doc(db, "cctv", id), {

      seri: seriBaru,
      jenis: jenisBaru,
      resolusi: resolusiBaru,
      harga: Number(hargaBaru)

    });

    loadData();

    alert("Produk berhasil diupdate");

  }

}
</script>

</body>
</html>
